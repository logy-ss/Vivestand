<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vivestand Flow</title>
<!-- The athlete's journey (src/Home → Injuries → Doctors → Online), the 4 steps of online.js, and the shop (Equipment → Cart).
     The .canvas size is the PNG size. Rebuild with: python docs/build.py diagrams -->
<link rel="stylesheet" href="../assets/brand.css">
<style>
  html, body { margin: 0; background: var(--white); }
  .canvas { width: 1600px; height: 960px; }
  svg { display: block; }
  .chip { font: 700 13px var(--mono); letter-spacing: 0.12em; }
  .title { font: 700 26px var(--display); fill: var(--ink); }
  .sub { font: 400 15px var(--mono); fill: var(--ink-soft); }
  .lane { font: 700 14px var(--mono); letter-spacing: 0.16em; fill: var(--ink-soft); }
  .small { font: 500 15px var(--mono); fill: var(--ink-soft); }
  .state { font: 700 21px var(--mono); }
</style>
</head>
<body>
<div class="canvas">
<svg width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B1F3A"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C41E47"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#066CBD"/>
    </marker>
  </defs>

  <!-- lane 1: the athlete's pages -->
  <rect x="20" y="20" width="1560" height="270" rx="18" fill="#F1F8FD" stroke="rgba(11,31,58,0.10)" stroke-width="2"/>
  <text x="48" y="50" class="lane">ATHLETE · FROM HURT TO TALKING WITH A DOCTOR</text>

  <g>
    <rect x="50" y="100" width="320" height="130" rx="12" fill="#fff" stroke="#0B1F3A" stroke-width="2.5"/>
    <rect x="70" y="116" width="72" height="24" rx="5" fill="none" stroke="#3A4F66" stroke-width="1.5"/>
    <text x="106" y="133" class="chip" fill="#3A4F66" text-anchor="middle">PAGE</text>
    <text x="210" y="180" class="title" text-anchor="middle">Home</text>
    <text x="210" y="208" class="sub" text-anchor="middle">pick 1 of 20 injuries</text>
  </g>
  <g>
    <rect x="450" y="100" width="320" height="130" rx="12" fill="#fff" stroke="#0B1F3A" stroke-width="2.5"/>
    <rect x="470" y="116" width="72" height="24" rx="5" fill="none" stroke="#3A4F66" stroke-width="1.5"/>
    <text x="506" y="133" class="chip" fill="#3A4F66" text-anchor="middle">PAGE</text>
    <text x="610" y="180" class="title" text-anchor="middle">Injury</text>
    <text x="610" y="208" class="sub" text-anchor="middle">symptoms · weeks · tips</text>
  </g>
  <g>
    <rect x="850" y="100" width="320" height="130" rx="12" fill="#fff" stroke="#0B1F3A" stroke-width="2.5"/>
    <rect x="870" y="116" width="72" height="24" rx="5" fill="none" stroke="#3A4F66" stroke-width="1.5"/>
    <text x="906" y="133" class="chip" fill="#3A4F66" text-anchor="middle">PAGE</text>
    <text x="1010" y="180" class="title" text-anchor="middle">Doctors</text>
    <text x="1010" y="208" class="sub" text-anchor="middle">61 doctors · filter · 💬</text>
  </g>
  <g>
    <rect x="1250" y="100" width="300" height="130" rx="12" fill="#FDEEF2" stroke="#E72C55" stroke-width="3"/>
    <rect x="1270" y="116" width="72" height="24" rx="5" fill="#E72C55"/>
    <text x="1306" y="133" class="chip" fill="#fff" text-anchor="middle">PAGE</text>
    <text x="1400" y="180" class="title" text-anchor="middle">Online</text>
    <text x="1400" y="208" class="sub" text-anchor="middle">free first session</text>
  </g>

  <line x1="372" y1="165" x2="446" y2="165" stroke="#0B1F3A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M610,98 V78 H1400 V96" fill="none" stroke="#0B1F3A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1172" y1="165" x2="1246" y2="165" stroke="#0B1F3A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="410" y="90" class="small" text-anchor="middle">?injury=knee</text>
  <rect x="930" y="64" width="190" height="26" fill="#F1F8FD"/>
  <text x="1025" y="83" class="small" text-anchor="middle">Consult a Doctor</text>
  <text x="1210" y="148" class="small" text-anchor="middle">Consult</text>
  <text x="1210" y="192" class="small" text-anchor="middle">Now</text>
  <text x="48" y="268" class="small">Doctors opens from the menu. All plain links: a page reads the name after "?" in its address (unknown name: "Injury Not Found").</text>

  <!-- lane 2: the online session -->
  <rect x="20" y="310" width="1560" height="300" rx="18" fill="#F1F8FD" stroke="rgba(11,31,58,0.10)" stroke-width="2"/>
  <text x="48" y="348" class="lane">ONLINE SESSION · ONE PAGE, 4 STEPS (showStep in online.js)</text>
  <path d="M1400,232 V372 H195 V386" fill="none" stroke="#C41E47" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-pink)"/>

  <g>
    <rect x="50" y="390" width="290" height="110" rx="55" fill="#EAF4FB" stroke="#066CBD" stroke-width="3"/>
    <text x="195" y="438" class="state" fill="#055499" text-anchor="middle">1 Questions</text>
    <text x="195" y="466" class="sub" text-anchor="middle">3 boxes to fill</text>
  </g>
  <g>
    <rect x="430" y="390" width="290" height="110" rx="55" fill="#EAF4FB" stroke="#066CBD" stroke-width="3"/>
    <text x="575" y="438" class="state" fill="#055499" text-anchor="middle">2 Session</text>
    <text x="575" y="466" class="sub" text-anchor="middle">10:00 timer counts down</text>
  </g>
  <g>
    <rect x="810" y="390" width="290" height="110" rx="55" fill="#EAF4FB" stroke="#066CBD" stroke-width="3"/>
    <text x="955" y="438" class="state" fill="#055499" text-anchor="middle">3 Pricing</text>
    <text x="955" y="466" class="sub" text-anchor="middle">next ones: 300 EGP</text>
  </g>
  <g>
    <rect x="1190" y="390" width="290" height="110" rx="55" fill="#FDEEF2" stroke="#E72C55" stroke-width="3"/>
    <text x="1335" y="438" class="state" fill="#C41E47" text-anchor="middle">4 Book</text>
    <text x="1335" y="466" class="sub" text-anchor="middle">date + time → ✓ Booked</text>
  </g>

  <line x1="342" y1="445" x2="426" y2="445" stroke="#0B1F3A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="722" y1="445" x2="806" y2="445" stroke="#0B1F3A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1102" y1="445" x2="1186" y2="445" stroke="#0B1F3A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="384" y="428" class="small" text-anchor="middle">start</text>
  <text x="764" y="428" class="small" text-anchor="middle">0:00 or</text>
  <text x="764" y="475" class="small" text-anchor="middle">End</text>
  <text x="1144" y="428" class="small" text-anchor="middle">book</text>

  <text x="48" y="552" class="small">Step 4 checks with plain ifs: a date is picked, a time is picked, and the moment is not in the past.</text>
  <text x="48" y="580" class="small">Nothing is sent anywhere: the card says "this is a demo, nothing was sent".</text>

  <!-- lane 3: the shop -->
  <rect x="20" y="630" width="1560" height="310" rx="18" fill="#F1F8FD" stroke="rgba(11,31,58,0.10)" stroke-width="2"/>
  <text x="48" y="668" class="lane">SHOP · SECOND-HAND GEAR, CART SAVED IN THE BROWSER</text>

  <g>
    <rect x="50" y="700" width="290" height="120" rx="12" fill="#fff" stroke="#0B1F3A" stroke-width="2.5"/>
    <rect x="70" y="716" width="72" height="24" rx="5" fill="none" stroke="#3A4F66" stroke-width="1.5"/>
    <text x="106" y="733" class="chip" fill="#3A4F66" text-anchor="middle">PAGE</text>
    <text x="195" y="777" class="title" text-anchor="middle">Equipment</text>
    <text x="195" y="804" class="sub" text-anchor="middle">pick 1 of 14 sports</text>
  </g>
  <g>
    <rect x="430" y="700" width="290" height="120" rx="12" fill="#fff" stroke="#0B1F3A" stroke-width="2.5"/>
    <rect x="450" y="716" width="72" height="24" rx="5" fill="none" stroke="#3A4F66" stroke-width="1.5"/>
    <text x="486" y="733" class="chip" fill="#3A4F66" text-anchor="middle">PAGE</text>
    <text x="575" y="777" class="title" text-anchor="middle">Products</text>
    <text x="575" y="804" class="sub" text-anchor="middle">18 listings · Add to cart</text>
  </g>
  <g>
    <rect x="810" y="700" width="290" height="120" rx="12" fill="#fff" stroke="#0B1F3A" stroke-width="2.5"/>
    <rect x="830" y="716" width="72" height="24" rx="5" fill="none" stroke="#3A4F66" stroke-width="1.5"/>
    <text x="866" y="733" class="chip" fill="#3A4F66" text-anchor="middle">PAGE</text>
    <text x="955" y="777" class="title" text-anchor="middle">Cart</text>
    <text x="955" y="804" class="sub" text-anchor="middle">− / + · total in EGP</text>
  </g>
  <g>
    <rect x="1190" y="700" width="290" height="120" rx="12" fill="#FDEEF2" stroke="#E72C55" stroke-width="3"/>
    <rect x="1210" y="716" width="86" height="24" rx="5" fill="#E72C55"/>
    <text x="1253" y="733" class="chip" fill="#fff" text-anchor="middle">ACTION</text>
    <text x="1335" y="777" class="title" text-anchor="middle">Place order</text>
    <text x="1335" y="804" class="sub" text-anchor="middle">name · phone · address</text>
  </g>
  <line x1="342" y1="760" x2="426" y2="760" stroke="#0B1F3A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="722" y1="760" x2="806" y2="760" stroke="#0B1F3A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1102" y1="760" x2="1186" y2="760" stroke="#0B1F3A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="384" y="690" class="small" text-anchor="middle">?sport=</text>
  <text x="764" y="690" class="small" text-anchor="middle">🛒 Cart (n)</text>

  <!-- the saved cart -->
  <rect x="430" y="850" width="670" height="64" rx="12" fill="#fff" stroke="#066CBD" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="450" y="878" class="lane" style="fill:#066CBD">localStorage["vivestand-cart"]</text>
  <text x="450" y="902" class="small">{ sport, mark, name, price, quantity } for each item</text>
  <path d="M575,822 V846" fill="none" stroke="#066CBD" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M955,846 V822" fill="none" stroke="#066CBD" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M1335,822 V882 H1104" fill="none" stroke="#C41E47" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-pink)"/>
  <text x="1150" y="910" class="small" style="fill:#C41E47">order done → cart emptied</text>
</svg>
</div>
</body>
</html>
