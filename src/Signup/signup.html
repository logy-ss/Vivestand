<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../Components/tokens.css">
    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">
</head>

<body>
    <main>

        <div class="signup center">
            <div class="title">
                <h1>Sign Up page</h1>
            </div>

            <form id="signup-form" novalidate>
                <div>
                    <label for="name">full name</label>
                    <input type="text" id="name" placeholder="write your name">
                </div>
                <div>
                    <label for="age">age</label>
                    <input type="number" id="age" placeholder="write your age">
                </div>
                <div>
                    <label for="email">email</label>
                    <input type="email" id="email" placeholder="write your email">
                </div>
                <div>
                    <label for="password">password</label>
                    <input type="password" id="password" placeholder="write your password">
                </div>

                <p class="form-message" id="form-message"></p>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </main>
    <script src="signup.js"></script>
</body>

</html>
