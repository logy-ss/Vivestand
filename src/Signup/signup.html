<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>
    <main>

        <div class="signup center">
            <div class="title">
                <h1>Sign Up page</h1>
            </div>

            <div>
                <label for="name">full name</label>
                <input type="text" id="name" placeholder="write your name">
            </div>
            <div>
                <label for="age">age</label>
                <input type="number" id="age" placeholder="write your age">
            </div>
            <div>
                <label for="email">email</label>
                <input type="email" id="email" placeholder="write your email">
            </div>
            <div>
                <label for="password">password</label>
                <input type="password" id="password" placeholder="write your password">
            </div>

            <button type="submit">Sign Up</button>
        </div>
    </main>
</body>

</html>
